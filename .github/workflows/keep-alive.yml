name: Keep backend awake

# Render's free web service sleeps after ~15 min idle, making the next request
# slow (~30-50s cold start). This workflow pings the health endpoint on a schedule
# to keep it warm. Best-effort: GitHub may delay scheduled runs under load.

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes (UTC)
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          URL="https://quiz-platform-qvqt.onrender.com/health"
          # Retry a few times so a cold start has time to wake up.
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$URL" || echo "000")
            echo "Attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Backend is awake."
              exit 0
            fi
            sleep 20
          done
          echo "::warning::Health check never returned 200"
          exit 1
